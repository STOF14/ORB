<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#000000" />
    <meta name="apple-mobile-web-app-title" content="Focus Timer" />
    <link rel="manifest" href="manifest.json" />
    <link rel="apple-touch-icon" sizes="180x180" href="icons/icon-192.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512.png" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="apple-touch-fullscreen" content="yes" />
    <meta name="apple-touch-startup-image" content="icons/icon-512.png" />
    <title>Focus Timer</title>
    <link rel="stylesheet" href="css/shared.css" />
    <link rel="stylesheet" href="css/timer.css" />
</head>
<body>
    <!-- Orb Brand (outside loader, red variant) -->
    <div class="orbitdesk-brand orbitdesk-brand--timer">
        <svg width="38" height="38" viewBox="0 0 38 38" fill="none" xmlns="http://www.w3.org/2000/svg" aria-label="Orb mini logo" role="img">
            <rect x="0" y="0" width="38" height="38" rx="8" fill="#fff"/>
            <circle cx="19" cy="19" r="13" stroke="#000" stroke-width="1.5" fill="none"/>
            <circle cx="19" cy="19" r="8" stroke="#000" stroke-width="0.75" stroke-dasharray="3 3" fill="none"/>
            <circle cx="19" cy="19" r="4" fill="#000"/>
            <circle cx="19" cy="6" r="3" fill="#e63946"/>
        </svg>
        <div class="orbitdesk-brand__meta">
            <span class="orbitdesk-brand__eyebrow">Deep Focus</span>
            <span class="orbitdesk-brand__name">Orb</span>
        </div>
    </div>

    <!-- Loader -->
    <div id="orbitdesk-loader" class="orbitdesk-loader" role="dialog" aria-label="Loading Orb">
        <div class="orbitdesk-loader__grid">
            <div class="orbitdesk-loader__text">
                <span class="orbitdesk-loader__word orbitdesk-loader__word--orb">Orb</span>
            </div>
            <div class="orbitdesk-loader__logo">
                <svg id="orb-logo" width="160" height="160" viewBox="0 0 160 160" fill="none" xmlns="http://www.w3.org/2000/svg" aria-label="Orb loader logo" role="img">
                    <rect x="0" y="0" width="160" height="160" fill="#fff"/>
                    <g id="orb-ring-group">
                        <circle id="orb-ring" cx="80" cy="80" r="56" stroke="#000" stroke-width="3" fill="none"/>
                        <circle id="orb-planet" cx="80" cy="24" r="11" fill="#e63946" filter="url(#shadow)"/>
                    </g>
                    <circle cx="80" cy="80" r="36" stroke="#000" stroke-width="1.5" stroke-dasharray="6 6" fill="none"/>
                    <circle id="orb-core" cx="80" cy="80" r="16" fill="#000"/>
                    <defs>
                        <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
                            <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000" flood-opacity="0.18"/>
                        </filter>
                    </defs>
                </svg>
            </div>
        </div>
    </div>

    <!-- Navigation -->
    <nav class="site-nav" role="navigation" aria-label="Main Navigation">
        <span class="nav-label">Navigate</span>
        <a href="dashboard.html">Dashboard</a>
        <a href="Semester1Timetable2026.html">Semester 1 Timetable</a>
        <a href="index.html">Semester 2 Timetable</a>
        <a href="planner.html">Day Planner</a>
        <a href="timer.html" class="active">Focus Timer</a>
        <a href="assignments.html">Assignments</a>
        <a href="analytics.html">Analytics</a>
    </nav>

    <div class="timer-container">
        <div class="mode-tabs">
            <button class="mode-tab active" data-mode="focus" onclick="setMode('focus')">Focus</button>
            <button class="mode-tab" data-mode="short" onclick="setMode('short')">Short Break</button>
            <button class="mode-tab" data-mode="long" onclick="setMode('long')">Long Break</button>
        </div>

        <div class="module-selector">
            <button class="mod-btn" data-mod="phy-255" onclick="selectModule(this)">PHY 255</button>
            <button class="mod-btn" data-mod="cos-210" onclick="selectModule(this)">COS 210</button>
            <button class="mod-btn" data-mod="cos-212" onclick="selectModule(this)">COS 212</button>
            <button class="mod-btn" data-mod="wtw-211" onclick="selectModule(this)">WTW 211</button>
            <button class="mod-btn" data-mod="wtw-218" onclick="selectModule(this)">WTW 218</button>
        </div>

        <div class="session-dots" id="sessionDots">
            <div class="session-dot"></div>
            <div class="session-dot"></div>
            <div class="session-dot"></div>
            <div class="session-dot"></div>
        </div>

        <div class="clock">
            <svg viewBox="0 0 300 300">
                <circle class="clock-bg" cx="150" cy="150" r="140" />
                <circle class="clock-progress" id="progress" cx="150" cy="150" r="140" />
            </svg>
            <div class="clock-text">
                <div class="time-display" id="timeDisplay">25:00</div>
                <div class="session-label" id="sessionLabel">Focus Session</div>
            </div>
        </div>

        <div class="controls">
            <button class="ctrl-btn" onclick="resetTimer()" title="Reset">↺</button>
            <button class="ctrl-btn primary" id="playBtn" onclick="toggleTimer()" title="Start">▶</button>
            <button class="ctrl-btn" onclick="skipSession()" title="Skip">⏭</button>
        </div>

        <div class="stats-bar">
            <div class="stat">
                <div class="stat-value" id="focusCount">0</div>
                <div class="stat-label">Sessions</div>
            </div>
            <div class="stat">
                <div class="stat-value" id="totalMinutes">0</div>
                <div class="stat-label">Minutes</div>
            </div>
            <div class="stat">
                <div class="stat-value" id="currentModule">—</div>
                <div class="stat-label">Studying</div>
            </div>
        </div>
    </div>

    <!-- Mobile Navigation -->
    <nav class="bottom-nav" aria-label="Mobile navigation">
        <span class="bottom-nav__page">Focus Timer</span>
        <button class="nav-toggle" id="navToggle" aria-label="Open navigation" aria-expanded="false">
            <span class="nav-toggle__icon"><span></span><span></span><span></span></span>
            <span class="nav-toggle__label">Menu</span>
        </button>
    </nav>
    <div class="nav-overlay" id="navOverlay" role="dialog" aria-label="Site navigation">
        <div class="nav-overlay__header">
            <span class="nav-overlay__brand">Orb</span>
            <button class="nav-overlay__close" id="navClose" aria-label="Close navigation">Close</button>
        </div>
        <nav class="nav-overlay__links">
            <a href="dashboard.html">Dashboard</a>
            <a href="Semester1Timetable2026.html">Semester 1 Timetable</a>
            <a href="index.html">Semester 2 Timetable</a>
            <a href="planner.html">Day Planner</a>
            <a href="timer.html" class="active">Focus Timer</a>
            <a href="assignments.html">Assignments</a>
            <a href="analytics.html">Analytics</a>
        </nav>
    </div>
    <script>(function(){var t=document.getElementById('navToggle'),o=document.getElementById('navOverlay'),c=document.getElementById('navClose');function open(){o.classList.add('open');t.setAttribute('aria-expanded','true');document.body.style.overflow='hidden';}function shut(){o.classList.remove('open');t.setAttribute('aria-expanded','false');document.body.style.overflow='';}t.addEventListener('click',open);c.addEventListener('click',shut);})();</script>

    <!-- Scripts (NO Firebase — timer uses localStorage only) -->
    <script src="js/loader.js"></script>
    <script src="js/mobile-workflow.js"></script>
    <script src="js/timer.js"></script>
</body>
</html>
