<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#000000" />
    <meta name="apple-mobile-web-app-title" content="Planner" />
    <link rel="manifest" href="manifest.json" />
    <link rel="apple-touch-icon" sizes="180x180" href="icons/icon-192.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512.png" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="apple-touch-fullscreen" content="yes" />
    <meta name="apple-touch-startup-image" content="icons/icon-512.png" />
    <title>Day Planner</title>
    <link rel="stylesheet" href="css/shared.css" />
    <link rel="stylesheet" href="css/planner.css" />
</head>
<body>
    <!-- Loader -->
    <div id="orbitdesk-loader" class="orbitdesk-loader" role="dialog" aria-label="Loading OrbitDesk">
        <div class="orbitdesk-loader__grid">
            <div class="orbitdesk-loader__text">
                <span class="orbitdesk-loader__word orbitdesk-loader__word--orbit">Orbit</span>
                <span class="orbitdesk-loader__word orbitdesk-loader__word--desk">Desk</span>
            </div>
            <div class="orbitdesk-loader__logo">
                <svg id="swiss-logo" width="160" height="160" viewBox="0 0 160 160" fill="none" xmlns="http://www.w3.org/2000/svg" aria-label="OrbitDesk Swiss Loader Logo" role="img">
                    <rect x="0" y="0" width="160" height="160" fill="#fff"/>
                    <g id="swiss-bars-group">
                        <rect id="swiss-bar" x="30" y="75" width="100" height="10" rx="5" fill="#e63946"/>
                        <rect id="swiss-bar-v" x="75" y="30" width="10" height="100" rx="5" fill="#e63946"/>
                    </g>
                    <circle id="swiss-dot" cx="80" cy="80" r="28" fill="#fff" stroke="#000" stroke-width="4" filter="url(#shadow)"/>
                    <defs>
                        <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
                            <feDropShadow dx="0" dy="6" stdDeviation="4" flood-color="#000" flood-opacity="0.18"/>
                        </filter>
                    </defs>
                </svg>
            </div>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>

    <!-- Navigation -->
    <nav class="site-nav" role="navigation" aria-label="Main Navigation">
        <span class="nav-label">Navigate</span>
        <a href="dashboard.html">Dashboard</a>
        <a href="Semester1Timetable2026.html">Semester 1 Timetable</a>
        <a href="index.html">Semester 2 Timetable</a>
        <a href="planner.html" class="active">Day Planner</a>
        <a href="timer.html">Focus Timer</a>
    </nav>

    <!-- Auth Bar -->
    <div class="auth-bar" id="authBar">
        <span class="sync-status offline" id="syncStatus">Local only</span>
        <div id="authContent">
            <button class="auth-btn" onclick="signInWithGoogle()">Sign in with Google</button>
        </div>
    </div>

    <div class="container">
        <!-- OrbitDesk Brand -->
        <div class="orbitdesk-brand" style="justify-content:center;margin-bottom:18px;">
            <svg width="38" height="38" viewBox="0 0 38 38" fill="none" xmlns="http://www.w3.org/2000/svg" aria-label="OrbitDesk mini logo" role="img">
                <rect x="0" y="0" width="38" height="38" rx="8" fill="#fff"/>
                <rect x="8" y="17" width="22" height="4" rx="2" fill="#e63946"/>
                <rect x="17" y="8" width="4" height="22" rx="2" fill="#e63946"/>
                <circle cx="19" cy="19" r="8" fill="#fff" stroke="#000" stroke-width="2"/>
            </svg>
            <span class="orbitdesk-brand__name">OrbitDesk</span>
        </div>

        <div class="planner-header">
            <h1>Day Planner</h1>
            <div class="date-controls">
                <button class="date-btn" onclick="changeDate(-1)" title="Previous day">‹</button>
                <div class="date-display" id="dateDisplay"></div>
                <button class="date-btn" onclick="changeDate(1)" title="Next day">›</button>
                <button class="today-btn" onclick="goToday()">Today</button>
            </div>
            <div class="day-label" id="dayLabel"></div>
        </div>

        <table class="planner-table">
            <thead>
                <tr>
                    <th>Time</th>
                    <th>Activity</th>
                    <th>✓</th>
                </tr>
            </thead>
            <tbody id="plannerBody">
                <!-- Generated by JS -->
            </tbody>
        </table>

        <div class="planner-footer">
            <div class="stats" id="stats"></div>
            <button class="clear-btn" onclick="clearDay()">Clear Day</button>
        </div>

        <!-- Free Period Optimizer -->
        <div class="free-periods" id="freePeriods" style="display:none;">
            <h3>Free Period Optimizer</h3>
            <div id="freeSlotsList"></div>
        </div>

        <!-- Habit Tracker -->
        <div class="habit-tracker" id="habitTracker">
            <h3>Daily Habits</h3>
            <ul class="habit-list" id="habitList"></ul>
            <div class="habit-score" id="habitScore"></div>
        </div>

        <!-- Sleep Logger -->
        <div class="sleep-logger" id="sleepLogger">
            <h3>Sleep Log</h3>
            <div class="sleep-inputs">
                <div class="sleep-field">
                    <label>Bedtime</label>
                    <input type="time" id="sleepBed" value="23:00">
                </div>
                <div class="sleep-field">
                    <label>Wake Up</label>
                    <input type="time" id="sleepWake" value="06:30">
                </div>
                <div class="sleep-result" id="sleepResult">
                    &mdash;<small>hours</small>
                </div>
            </div>
            <div class="sleep-quality" id="sleepQuality"></div>
        </div>
    </div>

    <!-- Bottom Navigation (mobile) -->
    <nav class="bottom-nav">
        <a href="dashboard.html"><span class="nav-icon">◻</span>Overview</a>
        <a href="Semester1Timetable2026.html"><span class="nav-icon">①</span>Sem 1</a>
        <a href="index.html"><span class="nav-icon">②</span>Sem 2</a>
        <a href="planner.html" class="active"><span class="nav-icon">▤</span>Planner</a>
        <a href="timer.html"><span class="nav-icon">◉</span>Focus</a>
    </nav>

    <!-- Scripts -->
    <script src="js/firebase-config.js"></script>
    <script src="js/loader.js"></script>
    <script src="js/planner.js"></script>
</body>
</html>
