<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="theme-color" content="#000000" />
    <meta name="apple-mobile-web-app-title" content="Planner" />
    <title>Day Planner</title>
    <style>
        :root {
            --red: #e63946;
            --blue: #457b9d;
            --dark-blue: #1d3557;
            --orange: #f4a261;
            --yellow: #e9c46a;
            --paper: #f5f5f0;
            --black: #000;
            --grid-line: #d1d5db;
            --text-muted: #6b7280;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--paper);
            font-family: "Futura", "Helvetica Neue", "Arial", sans-serif;
            color: #181818;
        }

        /* Navigation */
        .site-nav {
            background: var(--black);
            padding: 0 20px;
            display: flex;
            align-items: center;
            gap: 0;
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 3px solid var(--red);
        }

        .site-nav a {
            color: #999;
            text-decoration: none;
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            padding: 16px 20px;
            transition: color 0.2s ease, background 0.2s ease;
            font-family: "Futura", "Helvetica Neue", "Arial", sans-serif;
        }

        .site-nav a:hover {
            color: #fff;
            background: rgba(255, 255, 255, 0.08);
        }

        .site-nav a.active {
            color: #fff;
            border-bottom: 3px solid var(--red);
            margin-bottom: -3px;
        }

        .nav-spacer { flex: 1; }

        .nav-label {
            color: #555;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            padding-right: 10px;
            display: none;
        }

        /* Container */
        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 40px 20px 120px;
        }

        /* Header */
        .planner-header {
            margin-bottom: 30px;
        }

        h1 {
            font-size: 48px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 2px;
            line-height: 1;
            margin-bottom: 15px;
        }

        .date-controls {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 10px;
        }

        .date-btn {
            background: var(--black);
            color: #fff;
            border: none;
            width: 36px;
            height: 36px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
            -webkit-tap-highlight-color: transparent;
        }

        .date-btn:hover { background: var(--red); }

        .date-display {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            min-width: 280px;
            text-align: center;
        }

        .today-btn {
            background: none;
            border: 2px solid var(--black);
            color: var(--black);
            font-family: inherit;
            font-size: 10px;
            font-weight: 800;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            padding: 8px 16px;
            cursor: pointer;
            transition: all 0.2s;
            -webkit-tap-highlight-color: transparent;
        }

        .today-btn:hover {
            background: var(--black);
            color: #fff;
        }

        .day-label {
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--text-muted);
        }

        /* Planner Table */
        .planner-table {
            width: 100%;
            border-collapse: collapse;
            background: #fff;
            border: 3px solid var(--black);
        }

        .planner-table thead th {
            background: var(--black);
            color: #fff;
            padding: 14px 20px;
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            text-align: left;
        }

        .planner-table thead th:first-child {
            width: 130px;
        }

        .planner-table thead th:last-child {
            width: 50px;
            text-align: center;
        }

        .planner-table tbody tr {
            border-bottom: 1px solid var(--grid-line);
            transition: background 0.15s;
        }

        .planner-table tbody tr:hover {
            background: #f9fafb;
        }

        .planner-table tbody tr.current-slot {
            background: #fef3c7;
            border-left: 5px solid var(--orange);
        }

        .planner-table tbody tr.past-slot {
            opacity: 0.45;
        }

        .planner-table tbody tr.section-morning td {
            border-top: 3px solid var(--blue);
        }

        .planner-table tbody tr.section-afternoon td {
            border-top: 3px solid var(--orange);
        }

        .planner-table tbody tr.section-evening td {
            border-top: 3px solid var(--dark-blue);
        }

        .time-cell {
            padding: 12px 16px;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 0.5px;
            white-space: nowrap;
            vertical-align: top;
            color: var(--black);
            border-right: 1px solid var(--grid-line);
            user-select: none;
        }

        .time-period {
            display: block;
            font-size: 9px;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .activity-cell {
            padding: 0;
            vertical-align: top;
        }

        .activity-input {
            width: 100%;
            border: none;
            outline: none;
            padding: 12px 16px;
            font-family: inherit;
            font-size: 14px;
            font-weight: 500;
            background: transparent;
            color: var(--black);
            min-height: 44px;
            resize: none;
            line-height: 1.5;
        }

        .activity-input::placeholder {
            color: #ccc;
            font-style: italic;
            font-weight: 400;
        }

        .activity-input:focus {
            background: #eff6ff;
        }

        .check-cell {
            text-align: center;
            vertical-align: top;
            padding: 10px 8px;
            border-left: 1px solid var(--grid-line);
        }

        .check-cell input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: var(--red);
        }

        .planner-table tbody tr.checked-row {
            background: #f0fdf4;
        }

        .planner-table tbody tr.checked-row .activity-input {
            text-decoration: line-through;
            color: #999;
        }

        /* Class slots (auto-filled from timetable) */
        .planner-table tbody tr.class-slot {
            background: #f0f4ff;
        }

        .planner-table tbody tr.class-slot.past-slot {
            opacity: 0.45;
        }

        .class-badge {
            display: inline-block;
            font-size: 9px;
            font-weight: 800;
            letter-spacing: 1px;
            text-transform: uppercase;
            padding: 3px 8px;
            color: #fff;
            border-radius: 2px;
            margin-right: 8px;
            vertical-align: middle;
        }

        .class-badge.phy-255 { background: var(--red); }
        .class-badge.cos-210 { background: var(--blue); }
        .class-badge.cos-212 { background: var(--dark-blue); }
        .class-badge.wtw-211 { background: var(--orange); }
        .class-badge.wtw-218 { background: var(--yellow); color: #000; }

        .class-text {
            font-size: 13px;
            font-weight: 600;
            color: #444;
            line-height: 1.5;
        }

        /* Section Headers */
        .section-row td {
            background: var(--paper);
            padding: 8px 16px;
            font-size: 10px;
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--text-muted);
            border-bottom: 2px solid var(--grid-line);
        }

        /* Clear & Stats */
        .planner-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
            gap: 15px;
            flex-wrap: wrap;
        }

        .clear-btn {
            background: none;
            border: 2px solid var(--red);
            color: var(--red);
            font-family: inherit;
            font-size: 10px;
            font-weight: 800;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            padding: 10px 20px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .clear-btn:hover {
            background: var(--red);
            color: #fff;
        }

        .stats {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-muted);
            letter-spacing: 0.5px;
        }

        .stats span {
            font-weight: 800;
            color: var(--black);
        }

        /* Mobile */
        @media (max-width: 768px) {
            body {
                padding-bottom: 0;
            }

            .container {
                padding: 15px 10px 100px;
            }

            .site-nav { display: none; }

            .bottom-nav {
                display: flex;
                position: fixed;
                bottom: 0;
                left: 0;
                right: 0;
                background: var(--black);
                border-top: 3px solid var(--red);
                z-index: 200;
                padding-bottom: env(safe-area-inset-bottom);
            }

            .bottom-nav a {
                flex: 1;
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 4px;
                padding: 10px 5px;
                color: #666;
                text-decoration: none;
                font-family: inherit;
                font-size: 9px;
                font-weight: 800;
                letter-spacing: 1px;
                text-transform: uppercase;
                transition: color 0.2s ease;
                -webkit-tap-highlight-color: transparent;
            }

            .bottom-nav a.active { color: #fff; }

            .bottom-nav .nav-icon {
                font-size: 20px;
                line-height: 1;
            }

            h1 { font-size: 28px; margin-bottom: 10px; }

            .date-controls { gap: 8px; flex-wrap: wrap; }

            .date-display {
                font-size: 15px;
                min-width: 200px;
            }

            .time-cell {
                padding: 10px 8px;
                font-size: 12px;
            }

            .activity-input {
                padding: 10px 8px;
                font-size: 13px;
            }

            .planner-table thead th {
                padding: 10px 8px;
                font-size: 10px;
            }

            .planner-table thead th:first-child { width: 90px; }

            .planner-footer {
                flex-direction: column;
                align-items: stretch;
                gap: 10px;
            }
        }

        @media (min-width: 769px) {
            .bottom-nav { display: none; }
        }

        /* Subtle grid background */
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0;
            width: 100%;
            height: 100%;
            background-image:
                linear-gradient(var(--grid-line) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
            background-size: 20px 20px;
            opacity: 0.15;
            pointer-events: none;
            z-index: -1;
        }
        /* Auth bar */
        .auth-bar {
            background: #111;
            padding: 10px 20px;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 12px;
            font-size: 12px;
            color: #999;
            border-bottom: 1px solid #333;
        }

        .auth-bar .user-info {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .auth-bar .user-avatar {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            border: 2px solid var(--red);
        }

        .auth-bar .user-name {
            color: #ccc;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .auth-btn {
            background: var(--red);
            color: #fff;
            border: none;
            font-family: inherit;
            font-size: 10px;
            font-weight: 800;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            padding: 6px 14px;
            cursor: pointer;
            transition: opacity 0.2s;
            -webkit-tap-highlight-color: transparent;
        }

        .auth-btn:hover { opacity: 0.85; }

        .auth-btn.sign-out {
            background: transparent;
            border: 1px solid #555;
            color: #999;
        }

        .sync-status {
            font-size: 10px;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: #555;
        }

        .sync-status.synced { color: #22c55e; }
        .sync-status.syncing { color: var(--orange); }
        .sync-status.offline { color: var(--red); }

        @media (max-width: 768px) {
            .auth-bar {
                padding: 8px 10px;
                font-size: 11px;
            }

            .auth-bar .user-name { display: none; }
        }

        /* Free Period Optimizer */
        .free-periods {
            margin-top: 20px;
            padding: 20px;
            background: #fff;
            border: 2px solid var(--blue);
            border-left: 5px solid var(--blue);
        }

        .free-periods h3 {
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--blue);
            margin-bottom: 12px;
        }

        .free-slot {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 0;
            border-bottom: 1px solid #eee;
            font-size: 13px;
        }

        .free-slot:last-child { border-bottom: none; }

        .free-slot-time {
            font-weight: 700;
            min-width: 110px;
            font-size: 12px;
        }

        .free-slot-suggestion {
            color: var(--text-muted);
            font-size: 12px;
            font-style: italic;
        }

        .free-slot-duration {
            margin-left: auto;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: var(--blue);
            white-space: nowrap;
        }

        /* Habit Tracker */
        .habit-tracker {
            margin-top: 25px;
            padding: 20px;
            background: #fff;
            border: 2px solid var(--orange);
            border-left: 5px solid var(--orange);
        }

        .habit-tracker h3 {
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--orange);
            margin-bottom: 12px;
        }

        .habit-list { list-style: none; }

        .habit-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 0;
            border-bottom: 1px solid #f0f0f0;
            font-size: 14px;
            font-weight: 500;
        }

        .habit-item:last-child { border-bottom: none; }

        .habit-item input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: var(--orange);
            cursor: pointer;
        }

        .habit-item.done label {
            text-decoration: line-through;
            color: #999;
        }

        .habit-item label { cursor: pointer; flex: 1; }

        .habit-streak {
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 1px;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .habit-score {
            margin-top: 12px;
            text-align: right;
            font-size: 12px;
            font-weight: 700;
            color: var(--orange);
            letter-spacing: 0.5px;
        }

        /* Sleep Logger */
        .sleep-logger {
            margin-top: 25px;
            padding: 20px;
            background: #fff;
            border: 2px solid var(--dark-blue);
            border-left: 5px solid var(--dark-blue);
        }

        .sleep-logger h3 {
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--dark-blue);
            margin-bottom: 12px;
        }

        .sleep-inputs {
            display: flex;
            gap: 20px;
            align-items: center;
            flex-wrap: wrap;
        }

        .sleep-field {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .sleep-field label {
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: var(--text-muted);
        }

        .sleep-field input[type="time"] {
            font-family: inherit;
            font-size: 16px;
            font-weight: 600;
            padding: 6px 10px;
            border: 2px solid var(--grid-line);
            background: #fafafa;
            color: var(--black);
        }

        .sleep-field input[type="time"]:focus {
            outline: none;
            border-color: var(--dark-blue);
        }

        .sleep-result {
            font-size: 24px;
            font-weight: 300;
            color: var(--dark-blue);
            margin-left: auto;
        }

        .sleep-result small {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: var(--text-muted);
            display: block;
        }

        .sleep-quality {
            margin-top: 8px;
            font-size: 11px;
            font-weight: 600;
        }

        .sleep-quality.good { color: #22c55e; }
        .sleep-quality.ok { color: var(--orange); }
        .sleep-quality.bad { color: var(--red); }
    </style>
</head>

    <script>
                // Swiss Style OrbitDesk Loader Animation
                (function() {
                    const loader = document.getElementById('orbitdesk-loader');
                    const bar = document.getElementById('swiss-bar');
                    const barV = document.getElementById('swiss-bar-v');
                    const barsGroup = document.getElementById('swiss-bars-group');
                    const dot = document.getElementById('swiss-dot');
                    let t = 0;
                    let anim;
                    let minTime = 1200; // Minimum loader time in ms
                    let maxTime = 5000; // Maximum loader time in ms
                    let start = Date.now();
                    function animateSwissLogo() {
                        t += 0.06;
                        // Animate bars: grow/shrink and rotate
                        const h = 10 + 6 * Math.abs(Math.sin(t));
                        bar.setAttribute('height', h);
                        bar.setAttribute('y', 80 - h/2);
                        barV.setAttribute('width', h);
                        barV.setAttribute('x', 80 - h/2);
                        // Rotate the cross
                        const rot = Math.sin(t/1.5) * 18;
                        barsGroup.setAttribute('transform', `rotate(${rot} 80 80)`);
                        // Animate dot: bounce and pulse
                        const r = 28 + 4 * Math.abs(Math.sin(t*2));
                        dot.setAttribute('r', r);
                        dot.setAttribute('cx', 80);
                        dot.setAttribute('cy', 80 + Math.abs(Math.sin(t*2))*18);
                        anim = requestAnimationFrame(animateSwissLogo);
                    }
                    animateSwissLogo();
                    function hideLoader() {
                        loader.style.opacity = '0';
                        setTimeout(() => {
                            loader.style.display = 'none';
                            cancelAnimationFrame(anim);
                        }, 600);
                    }
                    // Hide loader after minTime if DOM is ready, else after maxTime
                    window.addEventListener('load', () => {
                        const elapsed = Date.now() - start;
                        setTimeout(hideLoader, Math.max(minTime - elapsed, 0));
                    });
                    setTimeout(hideLoader, maxTime);
                    if (window.history && window.history.pushState) {
                        window.addEventListener('popstate', () => {
                            loader.style.display = 'none';
                        });
                    }
                })();
        // ── Firebase Setup ──

        db.enablePersistence({ synchronizeTabs: true }).catch(err => {

        let currentUser = null;

        // ── Auth Functions ──

        auth.onAuthStateChanged(user => {

        // ── Firestore doc path for a date ──
        function docRef(dateStr) {
            return db.collection('users').doc(currentUser.uid)
                     .collection('planner').doc(dateStr);
        }

        // ── Data: load / save (Firestore if signed in, localStorage fallback) ──
        let cachedData = {}; // in-memory cache for current date

        function loadDataLocal(key) {
            try { return JSON.parse(localStorage.getItem('planner_' + key)) || {}; }
            catch { return {}; }
        }

        function saveDataLocal(key, data) {
            localStorage.setItem('planner_' + key, JSON.stringify(data));
        }

        async function loadData(key) {
            if (currentUser) {
                try {
                    const snap = await docRef(key).get();
                    if (snap.exists) {
                        cachedData = snap.data();
                        // Also keep localStorage in sync as offline backup
                        saveDataLocal(key, cachedData);
                        return cachedData;
                    }
                } catch (e) {
                    console.warn('Firestore read failed, using local:', e);
                }
            }
            cachedData = loadDataLocal(key);
            return cachedData;
        }

        function saveData(key, data) {
            // Always save locally
            saveDataLocal(key, data);

            // Also save to Firestore if signed in
            if (currentUser) {
                const syncEl = document.getElementById('syncStatus');
                syncEl.textContent = 'Syncing...';
                syncEl.className = 'sync-status syncing';

                docRef(key).set(data, { merge: true }).then(() => {
                    syncEl.textContent = 'Synced';
                    syncEl.className = 'sync-status synced';
                }).catch(err => {
                    console.error('Firestore write error:', err);
                    syncEl.textContent = 'Sync error';
                    syncEl.className = 'sync-status offline';
                });
            }
        }

        // ── Real-time listener: when data changes on another device ──
        function listenToDate(key) {
            if (unsubscribeSnapshot) unsubscribeSnapshot();
            if (!currentUser) return;

            unsubscribeSnapshot = docRef(key).onSnapshot(snap => {
                if (snap.exists && snap.metadata.hasPendingWrites === false) {
                    // Remote change came in — update UI without losing focus
                    cachedData = snap.data();
                    saveDataLocal(key, cachedData);
                    updateFieldsFromData(cachedData);
                    updateStats();
                }
            });
        }

        // Update fields without full re-render (preserves focus/cursor)
        function updateFieldsFromData(data) {
            const focused = document.activeElement;
            const focusIndex = focused && focused.dataset ? focused.dataset.index : null;

            document.querySelectorAll('.activity-input').forEach(input => {
                const idx = input.dataset.index;
                if (idx !== focusIndex) {
                    const val = data['slot_' + idx] || '';
                    if (input.value !== val) {
                        input.value = val;
                        autoResize(input);
                    }
                }
            });

            document.querySelectorAll('.check-cell input[type="checkbox"]').forEach(cb => {
                const idx = cb.dataset.index;
                const checked = data['check_' + idx] || false;
                if (cb.checked !== checked) {
                    cb.checked = checked;
                    cb.closest('tr').classList.toggle('checked-row', checked);
                }
            });
        }

        // ── Migrate localStorage → Firestore (one-time on first sign-in) ──
        async function migrateLocalToFirestore() {
            if (!currentUser) return;
            const migrated = localStorage.getItem('planner_migrated_' + currentUser.uid);
            if (migrated) return;

            const keys = [];
            for (let i = 0; i < localStorage.length; i++) {
                const k = localStorage.key(i);
                if (k.startsWith('planner_') && !k.includes('migrated')) {
                    keys.push(k);
                }
            }

            if (keys.length === 0) {
                localStorage.setItem('planner_migrated_' + currentUser.uid, 'true');
                return;
            }

            const batch = db.batch();
            keys.forEach(k => {
                const dateStr = k.replace('planner_', '');
                try {
                    const data = JSON.parse(localStorage.getItem(k));
                    if (data && Object.keys(data).length > 0) {
                        batch.set(docRef(dateStr), data, { merge: true });
                    }
                } catch {}
            });

            try {
                await batch.commit();
                localStorage.setItem('planner_migrated_' + currentUser.uid, 'true');
                console.log('Migrated', keys.length, 'days to Firestore');
            } catch (e) {
                console.error('Migration failed:', e);
            }
        }

        function getClassForSlot(date, slotStart) {
            // JS: 0=Sun, 1=Mon, ..., 6=Sat
            // Map to our TIMETABLE keys: 1=Mon, ..., 5=Fri
            const jsDay = date.getDay();
            if (jsDay === 0 || jsDay === 6) return null; // weekend
            const daySchedule = TIMETABLE[jsDay];
            if (!daySchedule) return null;
            return daySchedule[slotStart] || null;
        }

        // Time slots: same intervals as timetable (XX:30–XX:20), from 05:30 to 00:00
        const TIME_SLOTS = [
            { start: '05:30', end: '06:20', section: 'early' },
            { start: '06:30', end: '07:20', section: 'early' },
            { start: '07:30', end: '08:20', section: 'morning' },
            { start: '08:30', end: '09:20', section: 'morning' },
            { start: '09:30', end: '10:20', section: 'morning' },

            { start: '23:30', end: '00:00', section: 'night' },
        ];

        const SECTION_LABELS = {
            early:     'Early Morning',
            morning:   'Morning',
            afternoon: 'Afternoon',
            evening:   'Evening',
            night:     'Night',
        };

        const DAYS = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
        const MONTHS = ['January', 'February', 'March', 'April', 'May', 'June',
                        'July', 'August', 'September', 'October', 'November', 'December'];

        let currentDate = new Date();

        function dateKey(d) {
            return d.getFullYear() + '-' +
                   String(d.getMonth() + 1).padStart(2, '0') + '-' +
                   String(d.getDate()).padStart(2, '0');
        }

        function formatDate(d) {
            return d.getDate() + ' ' + MONTHS[d.getMonth()] + ' ' + d.getFullYear();
        }

        function getPeriodLabel(start) {
            const h = parseInt(start.split(':')[0]);
            if (h < 7) return 'Early';
            if (h < 12) return 'AM';
            if (h < 17) return 'PM';
            if (h < 21) return 'Eve';
            return 'Night';
        }

        function timeToMinutes(t) {
            const [h, m] = t.split(':').map(Number);
            // treat 00:00 as 24:00
            return h === 0 ? 24 * 60 : h * 60 + m;
        }

        async function renderPlanner() {
            const key = dateKey(currentDate);
            const data = await loadData(key);
            listenToDate(key);
            const tbody = document.getElementById('plannerBody');
            const now = new Date();
            const isToday = dateKey(now) === key;
            const currentMin = now.getHours() * 60 + now.getMinutes();

            tbody.innerHTML = '';

            let lastSection = '';

            TIME_SLOTS.forEach((slot, i) => {
                // Section divider
                if (slot.section !== lastSection) {
                    lastSection = slot.section;
                    const sectionRow = document.createElement('tr');
                    sectionRow.className = 'section-row';
                    sectionRow.innerHTML = '<td colspan="3">' + SECTION_LABELS[slot.section] + '</td>';
                    tbody.appendChild(sectionRow);
                }

                const tr = document.createElement('tr');
                const slotStart = timeToMinutes(slot.start);
                const slotEnd = timeToMinutes(slot.end);
                const classInfo = getClassForSlot(currentDate, slot.start);

                if (isToday) {
                    if (currentMin >= slotStart && currentMin < slotEnd) {
                        tr.classList.add('current-slot');
                    } else if (currentMin >= slotEnd) {
                        tr.classList.add('past-slot');
                    }
                }

                const checked = data['check_' + i] || false;
                if (checked) tr.classList.add('checked-row');

                const timeCellHtml =
                    '<td class="time-cell">' +
                        slot.start + '\u2013' + slot.end +
                        '<span class="time-period">' + getPeriodLabel(slot.start) + '</span>' +
                    '</td>';

                if (classInfo) {
                    tr.classList.add('class-slot');
                    tr.innerHTML = timeCellHtml +
                        '<td class="activity-cell" style="padding: 12px 16px;">' +
                            '<span class="class-badge ' + classInfo.code + '">' + classInfo.code.replace('-', ' ').toUpperCase() + '</span>' +
                            '<span class="class-text">' + classInfo.text + '</span>' +
                        '</td>' +
                        '<td class="check-cell">' +
                            '<input type="checkbox" data-index="' + i + '" ' +
                            (checked ? 'checked' : '') + '>' +
                        '</td>';
                } else {
                    tr.innerHTML = timeCellHtml +
                        '<td class="activity-cell">' +
                            '<textarea class="activity-input" rows="1" placeholder="Plan something..." ' +
                            'data-index="' + i + '">' +
                            (data['slot_' + i] || '') +
                            '</textarea>' +
                        '</td>' +
                        '<td class="check-cell">' +
                            '<input type="checkbox" data-index="' + i + '" ' +
                            (checked ? 'checked' : '') + '>' +
                        '</td>';
                }

                tbody.appendChild(tr);
            });

            // Date display
            document.getElementById('dateDisplay').textContent = formatDate(currentDate);
            document.getElementById('dayLabel').textContent = DAYS[currentDate.getDay()];

            // Attach events
            tbody.querySelectorAll('.activity-input').forEach(input => {
                input.addEventListener('input', function () {
                    autoResize(this);
                    cachedData['slot_' + this.dataset.index] = this.value;
                    saveData(dateKey(currentDate), cachedData);
                    updateStats();
                });
                autoResize(input);
            });

            tbody.querySelectorAll('input[type="checkbox"]').forEach(cb => {
                cb.addEventListener('change', function () {
                    cachedData['check_' + this.dataset.index] = this.checked;
                    saveData(dateKey(currentDate), cachedData);
                    const row = this.closest('tr');
                    row.classList.toggle('checked-row', this.checked);
                    updateStats();
                });
            });

            updateStats();

            // Scroll to current slot
            if (isToday) {
                const cur = tbody.querySelector('.current-slot');
                if (cur) {
                    setTimeout(() => cur.scrollIntoView({ behavior: 'smooth', block: 'center' }), 300);
                }
            }
        }

        function autoResize(el) {
            el.style.height = 'auto';
            el.style.height = el.scrollHeight + 'px';
        }

        function updateStats() {
            const data = cachedData;
            let filled = 0, checked = 0, total = TIME_SLOTS.length;

            TIME_SLOTS.forEach((_, i) => {
                if (data['slot_' + i] && data['slot_' + i].trim()) filled++;
                if (data['check_' + i]) checked++;
            });

            document.getElementById('stats').innerHTML =
                '<span>' + filled + '</span> / ' + total + ' planned — ' +
                '<span>' + checked + '</span> / ' + total + ' done';

            currentDate.setDate(currentDate.getDate() + delta);

        function goToday() {
            currentDate = new Date();
            renderPlanner();

            if (!confirm('Clear all entries for ' + formatDate(currentDate) + '?')) return;
            const key = dateKey(currentDate);
            localStorage.removeItem('planner_' + key);
            if (currentUser) {
                try { await docRef(key).delete(); } catch (e) { console.warn(e); }
            }
            cachedData = {};
            renderPlanner();

        // Init
        renderPlanner();

        setInterval(() => {
            if (dateKey(new Date()) === dateKey(currentDate)) {
                renderPlanner();

        // ── Free Period Optimizer ──
        const STUDY_SUGGESTIONS = [
            'Review lecture notes',
            'Practice problems',
            'Read textbook chapter',
            'Work on assignment',
            'Flashcard review',
            'Past paper practice',
            'Group study prep',
            'Lab report writing',
        ];

        function renderFreePeriods() {
            const container = document.getElementById('freePeriods');
            const list = document.getElementById('freeSlotsList');
            const jsDay = currentDate.getDay();
            if (jsDay === 0 || jsDay === 6) { container.style.display = 'none'; return; }
            const daySchedule = TIMETABLE[jsDay] || {};
            const classSlots = new Set(Object.keys(daySchedule));
            const uniSlots = TIME_SLOTS.filter(s => {
                const h = parseInt(s.start.split(':')[0]);
                return h >= 7 && h < 17;
            });
            const freeSlots = [];
            let blockStart = null, blockSlots = [];
            uniSlots.forEach(slot => {
                if (!classSlots.has(slot.start)) {
                    if (!blockStart) blockStart = slot.start;
                    blockSlots.push(slot);
                } else {
                    if (blockStart) {
                        freeSlots.push({ start: blockStart, end: blockSlots[blockSlots.length - 1].end, duration: blockSlots.length * 50 });
                        blockStart = null; blockSlots = [];
                    }
                }
            });
            if (blockStart) freeSlots.push({ start: blockStart, end: blockSlots[blockSlots.length - 1].end, duration: blockSlots.length * 50 });
            if (freeSlots.length === 0) { container.style.display = 'none'; return; }
            container.style.display = 'block';
            list.innerHTML = freeSlots.map((slot, i) => {
                const suggestion = STUDY_SUGGESTIONS[i % STUDY_SUGGESTIONS.length];
                const dur = slot.duration >= 60 ? Math.floor(slot.duration / 60) + 'h ' + (slot.duration % 60) + 'm' : slot.duration + ' min';
                return '<div class="free-slot">' +
                    '<span class="free-slot-time">' + slot.start + ' \u2013 ' + slot.end + '</span>' +
                    '<span class="free-slot-suggestion">' + suggestion + '</span>' +
                    '<span class="free-slot-duration">' + dur + '</span></div>';
            }).join('');
        }

        // ── Habit Tracker ──
        const HABITS = [
            { id: 'exercise', label: 'Exercise / Gym' },
            { id: 'review', label: 'Review lecture notes' },
            { id: 'water', label: 'Drink 2L+ water' },
            { id: 'no_phone', label: 'No phone in lectures' },
            { id: 'sleep8', label: '8 hours sleep' },
            { id: 'meal', label: '3 proper meals' },
        ];

        function loadHabitData(dateStr) {
            try { return JSON.parse(localStorage.getItem('habits_' + dateStr)) || {}; }
            catch { return {}; }
        }

        function saveHabitData(dateStr, data) {
            localStorage.setItem('habits_' + dateStr, JSON.stringify(data));
        }

        function getStreak(habitId) {
            let streak = 0;
            const d = new Date(currentDate);
            d.setDate(d.getDate() - 1);
            for (let i = 0; i < 30; i++) {
                const data = loadHabitData(dateKey(d));
                if (data[habitId]) { streak++; d.setDate(d.getDate() - 1); }
                else break;
            }
            return streak;
        }

        function renderHabits() {
            const list = document.getElementById('habitList');
            const key = dateKey(currentDate);
            const data = loadHabitData(key);
            let doneCount = 0;
            list.innerHTML = HABITS.map(h => {
                const checked = data[h.id] || false;
                if (checked) doneCount++;
                const streak = getStreak(h.id);
                const streakText = streak > 0 ? streak + 'd streak' : '';
                return '<li class="habit-item' + (checked ? ' done' : '') + '">' +
                    '<input type="checkbox" id="habit_' + h.id + '" ' + (checked ? 'checked' : '') +
                    ' onchange="toggleHabit(\'' + h.id + '\', this.checked)">' +
                    '<label for="habit_' + h.id + '">' + h.label + '</label>' +
                    (streakText ? '<span class="habit-streak">\uD83D\uDD25 ' + streakText + '</span>' : '') +
                    '</li>';
            }).join('');
            document.getElementById('habitScore').textContent = doneCount + ' / ' + HABITS.length + ' completed';
        }

        function toggleHabit(habitId, checked) {
            const key = dateKey(currentDate);
            const data = loadHabitData(key);
            data[habitId] = checked;
            saveHabitData(key, data);
            renderHabits();
        }

        // ── Sleep Logger ──
        function loadSleep() {
            const key = dateKey(currentDate);
            try {
                const data = JSON.parse(localStorage.getItem('sleep_' + key));
                if (data) {
                    document.getElementById('sleepBed').value = data.bed || '23:00';
                    document.getElementById('sleepWake').value = data.wake || '06:30';
                    calcSleep();
                } else {
                    document.getElementById('sleepBed').value = '23:00';
                    document.getElementById('sleepWake').value = '06:30';
                    document.getElementById('sleepResult').innerHTML = '\u2014<small>hours</small>';
                    document.getElementById('sleepQuality').textContent = '';
                }
            } catch {
                document.getElementById('sleepResult').innerHTML = '\u2014<small>hours</small>';
            }
        }

        function calcSleep() {
            const bed = document.getElementById('sleepBed').value;
            const wake = document.getElementById('sleepWake').value;
            if (!bed || !wake) return;
            const [bh, bm] = bed.split(':').map(Number);
            const [wh, wm] = wake.split(':').map(Number);
            let bedMin = bh * 60 + bm, wakeMin = wh * 60 + wm;
            if (wakeMin <= bedMin) wakeMin += 24 * 60;
            const hours = ((wakeMin - bedMin) / 60).toFixed(1);
            document.getElementById('sleepResult').innerHTML = hours + '<small>hours</small>';
            const quality = document.getElementById('sleepQuality');
            if (hours >= 7.5) { quality.textContent = '\u2713 Great sleep'; quality.className = 'sleep-quality good'; }
            else if (hours >= 6) { quality.textContent = '\u26A0 Could be better'; quality.className = 'sleep-quality ok'; }
            else { quality.textContent = '\u2717 Not enough sleep'; quality.className = 'sleep-quality bad'; }
            localStorage.setItem('sleep_' + dateKey(currentDate), JSON.stringify({ bed: bed, wake: wake, hours: parseFloat(hours) }));
        }

        document.getElementById('sleepBed').addEventListener('change', calcSleep);
        document.getElementById('sleepWake').addEventListener('change', calcSleep);

        // Hook into renderPlanner to also render new sections
        const _origRenderPlanner = renderPlanner;
        renderPlanner = async function() {
            await _origRenderPlanner();
            renderFreePeriods();
            renderHabits();
            loadSleep();
        };
        renderPlanner();
    </script>
</body>
</html>
